main:
  push:
    - name: test-linux-x86_64
      runner:
        tags: cnb:arch:amd64
      docker:
        image: rust:1-bookworm
      stages:
        - name: tools
          script: apt-get update && apt-get install -y --no-install-recommends python3
        - name: test without model or audio assets
          script: cargo test --locked
        - name: verify source payload
          script: python3 scripts/check_assets.py

$:
  tag_push:
    - name: release-linux-x86_64
      runner:
        tags: cnb:arch:amd64
      docker:
        image: rust:1-bookworm
      stages:
        - name: tools
          script: apt-get update && apt-get install -y --no-install-recommends python3
        - name: test
          script: cargo test --locked
        - name: package
          script: bash scripts/package.sh x86_64-unknown-linux-gnu "$CNB_BRANCH"
        - name: publish
          script: python3 scripts/publish_release.py "$CNB_BRANCH" dist/*
    - name: release-macos-arm64
      runner:
        namespace: group
        tags: [mac, arm64]
      stages:
        - name: test
          script: cargo test --locked
        - name: package
          script: bash scripts/package.sh aarch64-apple-darwin "$CNB_BRANCH"
        - name: publish
          script: python3 scripts/publish_release.py "$CNB_BRANCH" dist/*
