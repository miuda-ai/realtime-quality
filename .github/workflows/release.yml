name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "PACKAGE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
          fi
      - name: Linux tests and Debian 12 package
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e PACKAGE_VERSION rust:1-bookworm bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends python3
            git config --global --add safe.directory /work
            python3 scripts/check_assets.py
            cargo test --locked
            bash scripts/package.sh x86_64-unknown-linux-gnu "$PACKAGE_VERSION"
          '
      - name: macOS tests and arm64 package
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          rustup update stable --no-self-update
          rustup default stable
          python3 scripts/check_assets.py
          cargo test --locked
          bash scripts/package.sh aarch64-apple-darwin "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish both platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            test -f "dist/realtime-quality-${RELEASE_TAG}-${target}.tar.gz"
            (cd dist && sha256sum -c "realtime-quality-${RELEASE_TAG}-${target}.tar.gz.sha256")
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Linux x86_64 and macOS arm64. Models are downloaded separately; no audio or models are bundled. See README for setup."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
