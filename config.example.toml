listen = "127.0.0.1:8095"
# token = "replace-with-a-secret" # PBX sends Authorization: Bearer <token>
[detector]
# Each connection may override these fields in start.parameters.
beep_enabled = true
asr_enabled = false
asr_languages = ["id", "en"]
stable_updates = 2
hangup_on_asr = false
# Optional subtitles from ONE model; both models can still match keywords.
# text_language = "id"
keywords = [
  { language = "id", phrase = "layanan pesan suara" },
  { language = "id", phrase = "rekam pesan anda setelah" },
  { language = "en", phrase = "forwarded to voicemail" },
  { language = "en", phrase = "forwarded to voice mail" },
  { language = "en", phrase = "please record your message after the tone" },
  { language = "en", phrase = "welcome to voicemail service" },
  { language = "en", phrase = "welcome to voice mail service" },
]
frequencies_hz = [1309.0, 660.0]
tolerance_hz = 20.0
min_tone_ms = 160
max_gap_ms = 40
min_dbfs = -35.0
min_energy_ratio = 0.8
inspect_ms = 30000
hangup_on_beep = false

# Models are loaded once at startup. Use absolute paths outside the source tree.
# Uncomment model tables and set asr_enabled=true to enable local streaming ASR.
# Each model requires a matching streaming transducer encoder/decoder/joiner/tokens set.
# [models.id]
# encoder = "/var/lib/realtime-quality/models/id/encoder-iter-100000-avg-15-chunk-32-left-256.int8.onnx"
# decoder = "/var/lib/realtime-quality/models/id/decoder-iter-100000-avg-15-chunk-32-left-256.onnx"
# joiner = "/var/lib/realtime-quality/models/id/joiner-iter-100000-avg-15-chunk-32-left-256.int8.onnx"
# tokens = "/var/lib/realtime-quality/models/id/tokens.txt"
# num_threads = 2
# max_batch_size = 4
# max_wait_ms = 5

# [models.en]
# encoder = "/var/lib/realtime-quality/models/en/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
