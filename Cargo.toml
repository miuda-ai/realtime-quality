[package]
name = "realtime-quality"
version = "0.1.0"
edition = "2024"
publish = false
description = "Streaming English and Indonesian voicemail keyword and configurable beep detection"

[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
bytemuck = "1"
dasp_sample = "0.11"
rubato = "0.16.2"
rtrb = "0.4"
crossbeam-utils = "0.8"
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sherpa-onnx = "2.0.1"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
hound = "3.5"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
